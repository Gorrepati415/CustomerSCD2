
name: Upload Python Files to S3

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  upload-python-files:

    runs-on: ubuntu-latest

    steps:
      # Step 1: Get files from GitHub
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 3: Verify AWS connection
      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # Step 4: Upload Python files to S3
      - name: Upload Python Files to S3
        run: |
          Bucket_Name="batch2026-temp"

      # Step 5: Verify uploaded files
      - name: Verify S3 Upload
        run: |
          aws s3 ls s3://data-demo-first/glue/scripts/
